<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/account/forgot-password}" method="post"
      class="col-md-4 mx-auto">

    <h3 class="mb-3">Quên mật khẩu</h3>

    <input name="email"
           class="form-control mb-3"
           placeholder="Nhập email đã đăng ký" required>

    <button class="btn btn-danger w-100">Gửi mật khẩu mới</button>
</form>

</body>
</html>
