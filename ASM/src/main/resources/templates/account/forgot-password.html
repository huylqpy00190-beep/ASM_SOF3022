<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="content">
<div class="card shadow col-md-4 mx-auto mt-5">
    <div class="card-body">
        <form th:action="@{/account/forgot-password}" method="post">
            <h3 class="mb-3 text-center text-danger">Quên mật khẩu</h3>

            <div th:if="${error}" class="alert alert-danger p-2 small">
                <i class="bi bi-x-circle"></i> [[${error}]]
            </div>

            <div th:if="${message}" class="alert alert-success p-2 small">
                <i class="bi bi-check-circle"></i> [[${message}]]
            </div>

            <p class="text-muted small">Vui lòng nhập email bạn đã đăng ký. Hệ thống sẽ gửi mật khẩu mới về email này.</p>

            <input name="email" type="email"
                   class="form-control mb-3"
                   placeholder="Nhập email đã đăng ký" required>

            <button class="btn btn-danger w-100 fw-bold">Gửi mật khẩu mới</button>

            <div class="text-center mt-3">
                <a th:href="@{/auth/login}" class="text-decoration-none small">Quay lại đăng nhập</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
