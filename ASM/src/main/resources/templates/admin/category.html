<!DOCTYPE html>
<html th:replace="layout/layout :: body"
      xmlns:th="http://www.thymeleaf.org">
<body>

<h3 class="mb-3">📂 Quản lý loại hàng</h3>

<form th:action="@{/admin/category/create}" method="post"
      class="row g-2 mb-4">
    <div class="col-md-3">
        <input name="id" class="form-control" placeholder="Mã loại" required>
    </div>
    <div class="col-md-5">
        <input name="name" class="form-control" placeholder="Tên loại" required>
    </div>
    <div class="col-md-2">
        <button class="btn btn-primary w-100">Lưu</button>
    </div>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-secondary">
    <tr>
        <th>Mã</th>
        <th>Tên loại</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${items}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td>
            <a th:href="@{/admin/category/edit/{id}(id=${c.id})}"
               class="btn btn-sm btn-warning">Edit</a>
            <a th:href="@{/admin/category/delete/{id}(id=${c.id})}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('Xóa loại này?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
