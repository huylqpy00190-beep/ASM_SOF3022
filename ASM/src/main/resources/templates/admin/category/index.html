<!DOCTYPE html>
<html
      xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📂 Quản lý loại hàng</h3>
        <a th:href="@{/admin/category/form}" class="btn btn-primary">➕ Thêm loại mới</a>
    </div>

    <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Mã</th>
            <th>Tên loại</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${page.content}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td>
                <a th:href="@{/admin/category/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/category/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa loại này?')">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation" th:if="${page.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/category/index(p=${page.number - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.number == page.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/category/index(p=${page.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</html>
