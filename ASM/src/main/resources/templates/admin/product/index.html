<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📦 Quản lý sản phẩm</h3>
        <a th:href="@{/admin/product/form}" class="btn btn-primary">➕ Thêm sản phẩm mới</a>
    </div>

    <table class="table table-bordered table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>Ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Loại</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${page.content}">
            <td><img th:src="@{|/images/products/${p.image}|}" style="width: 50px; height: 50px; object-fit: cover;"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${#numbers.formatDecimal(p.price, 1, 'POINT', 0, 'COMMA')} + ' đ'"></td>
            <td th:text="${p.category.name}"></td>
            <td>
                    <span th:class="${p.available ? 'badge bg-success' : 'badge bg-danger'}"
                          th:text="${p.available ? 'Còn hàng' : 'Hết hàng'}"></span>
            </td>
            <td>
                <a th:href="@{/admin/product/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/product/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa sản phẩm này?')">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${page.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/product/index(p=${page.number - 1})}">Trước</a>
            </li>
            <li class="page-item active"><span class="page-link" th:text="${page.number + 1}"></span></li>
            <li class="page-item" th:classappend="${page.number == page.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/product/index(p=${page.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</html>
