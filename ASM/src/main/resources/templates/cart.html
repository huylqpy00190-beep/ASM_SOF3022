<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h3 class="mb-4">🛒 Giỏ hàng</h3>

<table class="table table-bordered">
    <thead class="table-dark">
    <tr>
        <th>Sản phẩm</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th>Thành tiền</th>
        <th></th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${cart.items}">
        <td th:text="${item.name}"></td>
        <td th:text="${item.price}"></td>

        <td>
            <input type="number" min="1"
                   th:value="${item.qty}"
                   class="form-control">
        </td>

        <td th:text="${item.price * item.qty}"></td>

        <td>
            <a th:href="@{/cart/remove/{id}(id=${item.id})}"
               class="btn btn-danger btn-sm">
                X
            </a>
        </td>
    </tr>
    </tbody>
</table>

<div class="text-end">
    <h5>Tổng tiền:
        <span class="text-danger fw-bold"
              th:text="${cart.amount}"></span>
    </h5>

    <a th:href="@{/order/checkout}"
       class="btn btn-success mt-2">
        Thanh toán
    </a>
</div>

</body>
</html>
