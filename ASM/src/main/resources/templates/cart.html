<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">
<h3 class="mb-4">🛒 Giỏ hàng</h3>

    <table class="table">
        <thead>
        <tr>
            <th>Ảnh</th>
            <th>Tên</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Tổng</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
            <td><img th:src="@{|/images/products/${item.product.image}|}" width="50"></td>
            <td th:text="${item.product.name}"></td>
            <td th:text="${#numbers.formatDecimal(item.product.price, 1, 'POINT', 0, 'COMMA')} + ' đ'"></td>
            <td>
                <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post">
                    <input type="number" name="qty" th:value="${item.quantity}" onchange="this.form.submit()" style="width: 60px;">
                </form>
            </td>
            <td th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 'POINT', 0, 'COMMA')} + ' đ'"></td>
            <td>
                <a th:href="@{/cart/remove/{id}(id=${item.product.id})}" class="btn btn-sm btn-danger">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-end">
        <h4>Tổng thanh toán:
            <span class="text-danger" th:text="${#numbers.formatDecimal(cart.amount, 1, 'POINT', 0, 'COMMA')} + ' đ'"></span>
        </h4>
        <a th:href="@{/cart/clear}" class="btn btn-outline-danger">Xóa sạch giỏ hàng</a>
        <a th:href="@{/order/checkout}" class="btn btn-success">Thanh toán</a>
    </div>
</div>
</body>
</html>
