<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="list-group shadow-sm">
                <div class="list-group-item bg-dark text-white fw-bold">
                    📁 DANH MỤC
                </div>
                <a th:href="@{/home/index}" class="list-group-item list-group-item-action">
                    Tất cả sản phẩm
                </a>
                <a th:each="c : ${categories}"
                   th:href="@{|/product/list-by-category/${c.id}|}"
                   class="list-group-item list-group-item-action"
                   th:text="${c.name}">
                </a>
            </div>
        </div>

        <div class="col-md-9">
            <h3 class="mb-4">🔥 Sản phẩm nổi bật</h3>
            <div class="row">
                <div class="col-md-4 mb-4" th:each="p : ${items}">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="position-relative">
                            <img th:src="@{|/images/products/${p.image}|}"
                                 class="card-img-top p-2"
                                 onerror="this.src='/images/no-image.png'"
                                 style="height: 250px; object-fit: contain;">
                        </div>

                        <div class="card-body d-flex flex-column">
                            <h6 class="card-title text-truncate-2" style="height: 40px;" th:text="${p.name}"></h6>

                            <p class="card-text text-danger fw-bold mt-auto mb-3"
                               th:text="${#numbers.formatDecimal(p.price, 1, 'POINT', 0, 'COMMA')} + ' đ'">
                            </p>

                            <a th:href="@{/product/detail/{id}(id=${p.id})}"
                               class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-eye"></i> Chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>

</body>
</html>
<style>
    .text-truncate-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>
