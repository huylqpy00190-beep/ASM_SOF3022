<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h3 class="mb-3">Đơn hàng của tôi</h3>

<table class="table table-bordered">
    <tr>
        <th>Mã</th>
        <th>Ngày</th>
        <th>Địa chỉ</th>
        <th></th>
    </tr>

    <tr th:each="o : ${orders}">
        <td th:text="${o.id}"></td>
        <td th:text="${o.createDate}"></td>
        <td th:text="${o.address}"></td>
        <td>
            <a th:href="@{/order/detail/{id}(id=${o.id})}"
               class="btn btn-sm btn-info">Chi tiết</a>
        </td>
    </tr>
</table>

</body>
</html>
