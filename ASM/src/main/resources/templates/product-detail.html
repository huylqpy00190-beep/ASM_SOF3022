<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="content">
<div class="row mt-4">
    <div class="col-md-6 text-center">
        <img th:src="@{|/images/products/${item.image}|}"
             class="img-fluid rounded shadow"
             onerror="this.src='/images/no-image.png'"
             style="max-height: 400px; object-fit: contain;">
    </div>
    <div class="col-md-6">
        <h2 th:text="${item.name}" class="mb-3"></h2>
        <h3 class="text-danger fw-bold mb-4"
            th:text="${#numbers.formatDecimal(item.price, 1, 'POINT', 0, 'COMMA')} + ' đ'">
        </h3>

        <div class="p-3 bg-light rounded mb-4">
            <p><strong>Trạng thái:</strong>
                <span th:text="${item.available ? 'Còn hàng' : 'Hết hàng'}"
                      th:class="${item.available ? 'text-success' : 'text-danger'}"></span>
            </p>
            <p><strong>Ngày đăng:</strong> <span th:text="${#dates.format(item.createDate, 'dd-MM-yyyy')}"></span></p>
        </div>

        <div class="d-grid gap-2">
            <a th:href="@{/cart/add/{id}(id=${item.id})}" class="btn btn-success btn-lg">
                <i class="bi bi-cart-plus"></i> Thêm vào giỏ hàng
            </a>
            <a th:href="@{/home/index}" class="btn btn-outline-secondary">Quay lại trang chủ</a>
        </div>
    </div>
</div>
</body>
</html>
