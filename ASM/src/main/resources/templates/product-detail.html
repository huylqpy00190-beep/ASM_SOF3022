<!DOCTYPE html>
<html th:replace="layout/layout :: body" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="row">
    <div class="col-md-6">
        <img th:src="@{/images/{img}(img=${item.image})}" class="img-fluid">
    </div>
    <div class="col-md-6">
        <h3 th:text="${item.name}"></h3>
        <h4 class="text-danger" th:text="${item.price}"></h4>
        <a th:href="@{/cart/add/{id}(id=${item.id})}" class="btn btn-success">Thêm giỏ hàng</a>
    </div>
</div>
</body>
</html>
